name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Check out with corpus submodule
        uses: actions/checkout@v7
        with:
          # The test suite is driven by external/koma/corpus. Without the
          # submodule the tests do not merely fail, they have nothing to run.
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Every suite, the interface one included: it draws no window, so it
      # needs no display. The arguments after -- go to the testing platform,
      # which otherwise writes the failures to a log nobody reads.
      # --output Detailed, so that a failure names the test here rather than
      # in a log file nobody fetches from a runner.
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Keep the test logs when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: '**/TestResults/*.log'
          if-no-files-found: ignore

  # A workflow that does not parse fails before it starts, and says so only
  # in the Actions tab. actionlint reads the workflows the way GitHub will,
  # contexts included, and fails the push instead: it would have caught the
  # runner context used where a job cannot see it.
  workflows:
    # Pinned rather than latest: actionlint runs shellcheck from the image,
    # and a linter has nothing to gain from an image moving under it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Lint the workflows
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.9/scripts/download-actionlint.bash) 1.7.9
          ./actionlint -color
