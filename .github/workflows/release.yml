name: Release

# A tag v0.1.0 builds, tests and publishes the reader for Windows and Linux,
# then makes a GitHub release of it. Run by hand, it stops before the release
# and leaves the builds as artifacts, to try one before tagging it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64

    steps:
      - name: Check out with corpus submodule
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Outside the checkout, so that nothing the repository holds can end up
      # beside the executable: a stray build committed once was enough to make
      # two files of one. Set from a step because the runner context is not
      # available at the level of a job. Forward slashes, which both Git Bash
      # and dotnet read on Windows.
      - name: Choose the output folder
        shell: bash
        run: echo "OUTPUT=${RUNNER_TEMP//\\//}/publish" >> "$GITHUB_ENV"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # A release is the tagged commit as CI would judge it: nothing is
      # published from a tree whose tests fail on the platform it targets.
      - name: Test
        run: dotnet test --configuration Release

      # Self-contained, so that nothing has to be installed first, and one
      # file with its native libraries inside: Skia and HarfBuzz ship native
      # code, which a single-file publish leaves beside the executable unless
      # told to carry it. No symbol files, which the project also drops for
      # the native libraries. Not trimmed: Avalonia's XAML loading reflects
      # over types a trimmer cannot see.
      - name: Publish
        shell: bash
        run: |
          # v0.1.0 is the tag; 0.1.0 is the version .NET accepts. A run by hand
          # is no release and says so.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version="0.0.0"; fi

          dotnet publish src/Koma.Desktop/Koma.Desktop.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            --output "$OUTPUT" \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=none \
            -p:Version="$version"

          # The command line is published beside the reader, from the same
          # commit and over the same Koma.Imaging: what converts a CBZ is one
          # implementation, and a release ships it twice rather than letting
          # the two drift.
          dotnet publish src/Koma.Cli/Koma.Cli.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            --output "$OUTPUT/cli" \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=none \
            -p:Version="$version"

      # The release is one file a reader downloads and runs. Anything else
      # left in the output would have to travel with it, so a second file
      # fails the build rather than a reader's first launch, and says what
      # each file is.
      - name: Check the output is one file
        shell: bash
        run: |
          count=$(find "$OUTPUT" -maxdepth 1 -type f | wc -l)

          if [ "$count" -ne 1 ]; then
            echo "The publish left $count files where one was expected:"
            ls -la "$OUTPUT"
            file "$OUTPUT"/* || true
            exit 1
          fi

          # The same for the command line, in its own folder.
          tools=$(find "$OUTPUT/cli" -maxdepth 1 -type f | wc -l)

          if [ "$tools" -ne 1 ]; then
            echo "The command line publish left $tools files where one was expected:"
            ls -la "$OUTPUT/cli"
            exit 1
          fi

      - name: Name the executable
        shell: bash
        run: |
          name="koma-desktop-${GITHUB_REF_NAME}-${{ matrix.rid }}"
          tool="koma-${GITHUB_REF_NAME}-${{ matrix.rid }}"

          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            cp "$OUTPUT/Koma.Desktop.exe" "${name}.exe"
            cp "$OUTPUT/cli/koma.exe" "${tool}.exe"
          else
            cp "$OUTPUT/Koma.Desktop" "${name}"
            cp "$OUTPUT/cli/koma" "${tool}"
            chmod +x "${name}" "${tool}"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.rid }}
          path: |
            koma-desktop-*
            koma-v*
          if-no-files-found: error

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The same hygiene as the specification repository: what is downloaded
      # can be checked against what CI built.
      - name: Checksums
        working-directory: dist
        run: sha256sum koma-desktop-* koma-v* > SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes